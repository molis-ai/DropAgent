<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DropAgent 原型</title>
  <style>
    :root {
      --desk: #121212;
      --panel: #f7f7f5;
      --panel-2: #ececea;
      --panel-hover: #e2e2e0;
      --panel-press: #d2d2d0;
      --line: rgba(0,0,0,.1);
      --text: #111;
      --muted: #5a5a5a;
      --faint: #6e6e6e;
      --blue: #111;
      --blue-press: #000;
      --green: #111;
      --red: #111;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      background: var(--desk);
      color: #e8e8e4;
      min-height: 100dvh;
      overflow: hidden;
      user-select: none;
    }
    button, input { font-family: inherit; }
    input { user-select: text; caret-color: var(--text); }
    ::selection { background: rgba(0,0,0,.14); color: var(--text); }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .list::-webkit-scrollbar,
    .ai-body::-webkit-scrollbar { width: 8px; }
    .list::-webkit-scrollbar-thumb,
    .ai-body::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,.18);
      border-radius: 99px;
    }

    .desk {
      position: relative;
      height: 100dvh;
      background:
        radial-gradient(800px 420px at 80% -8%, #2a2a2e 0%, transparent 58%),
        var(--desk);
    }

    .menubar {
      position: absolute;
      inset: 0 0 auto 0;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px 0 10px;
      background: rgba(22,22,24,.82);
      backdrop-filter: blur(28px) saturate(1.1);
      border-bottom: 1px solid rgba(255,255,255,.06);
      font-size: 13px;
      color: #e8e8e4;
      z-index: 20;
    }
    .menubar-left { display: flex; align-items: center; gap: 16px; }
    .apple { width: 14px; height: 14px; opacity: .92; }
    .menubar-left span:nth-child(2) { font-weight: 600; }
    .menubar-right { display: flex; align-items: center; gap: 12px; }
    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 22px;
      padding: 0 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    .status-item:hover,
    .status-item.open { background: rgba(255,255,255,.12); }
    .status-item.hot {
      background: rgba(0,0,0,.35);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.4);
    }
    .clock { font-variant-numeric: tabular-nums; }

    .edge {
      position: absolute;
      top: 28px;
      left: 8px;
      right: 8px;
      transform: translateY(-10px);
      opacity: 0;
      pointer-events: none;
      height: 36px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid rgba(0,0,0,.1);
      box-shadow: 0 8px 24px rgba(0,0,0,.28);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 15;
      transition: opacity .16s ease, transform .15s ease;
    }
    .desk.dragging .edge {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .edge.hot { color: var(--panel); background: #111; }

    .panel {
      position: absolute;
      top: 34px;
      right: 16px;
      width: 400px;
      height: min(620px, calc(100dvh - 56px));
      display: none;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid rgba(0,0,0,.1);
      border-radius: 12px;
      box-shadow:
        0 18px 48px rgba(0,0,0,.28),
        0 2px 8px rgba(0,0,0,.16);
      overflow: hidden;
      color: var(--text);
      z-index: 30;
    }
    .panel.show { display: flex; }

    .head {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      position: relative;
      height: 44px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .brand {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -.02em;
      font-family: "New York", "Iowan Old Style", "Times New Roman", serif;
      pointer-events: none;
    }
    .agent-wrap { position: relative; justify-self: end; }
    .agent-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 24px;
      padding: 0 7px;
      border: 0;
      border-radius: 6px;
      background: var(--panel-2);
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }
    .agent-pill .chev { opacity: .7; }
    .engine-menu {
      position: absolute;
      right: 0;
      top: 28px;
      z-index: 8;
      min-width: 148px;
      padding: 4px;
      border-radius: 6px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    .engine-menu button {
      display: block;
      width: 100%;
      height: 28px;
      padding: 0 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
    }
    .engine-menu button:hover { background: var(--panel-2); }
    .engine-menu button:disabled { color: var(--faint); cursor: not-allowed; }
    .engine-menu button.on { background: rgba(0,0,0,.08); }
    .agent-pill .status-ico {
      display: inline-flex;
      width: 12px;
      height: 12px;
    }
    .agent-pill .status-ico .ico { width: 12px; height: 12px; }

    .list-wrap {
      position: relative;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      min-height: 56px;
    }
    .list {
      flex: 1;
      overflow: auto;
    }
    .list.drop-hot { background: rgba(0,0,0,.06); }
    .list-hint {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: rgba(247,247,245,.92);
      pointer-events: none;
    }
    .desk.dragging .list-wrap .list-hint { display: flex; }

    .empty {
      height: 100%;
      min-height: 108px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 12px 24px;
    }
    .empty .ico { width: 22px; height: 22px; color: var(--text); }
    .empty small { font-size: 11px; color: var(--faint); line-height: 1.4; }

    .row {
      display: grid;
      grid-template-columns: auto 1fr auto 18px;
      grid-template-rows: auto auto;
      column-gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      cursor: grab;
      height: 56px;
    }
    .row:hover { background: var(--panel-2); }
    .row.sel { background: rgba(0,0,0,.08); box-shadow: inset 2px 0 0 var(--text); }
    .row.dragging-out { opacity: .45; }
    .row.running { cursor: default; }
    .tag {
      grid-row: 1 / span 2;
      align-self: start;
      margin-top: 2px;
      height: 18px;
      padding: 0 5px;
      border-radius: 4px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      display: flex;
      align-items: center;
    }
    .row .name {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -.015em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row .time {
      font-size: 11px;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
      padding-top: 2px;
    }
    .row .kill {
      grid-row: 1;
      width: 18px;
      height: 18px;
      margin-top: 1px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--faint);
      opacity: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .row .kill .ico { width: 10px; height: 10px; }
    .row:hover .kill, .row.sel .kill { opacity: 1; }
    .row .kill:hover { background: var(--panel-2); color: var(--text); }
    .row .meta {
      grid-column: 2 / span 3;
      font-size: 11px;
      color: var(--faint);
      margin-top: 2px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      height: 16px;
      padding: 0 6px;
      border-radius: 99px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 10px;
      margin-right: 6px;
    }
    .pill.run { background: rgba(0,0,0,.08); color: var(--text); }
    .pill.ok { background: rgba(0,0,0,.08); color: var(--text); }
    .pill.sent { background: rgba(0,0,0,.08); color: var(--text); }

    .splitbar {
      height: 7px;
      flex-shrink: 0;
      cursor: ns-resize;
      background: var(--line);
      position: relative;
    }
    .splitbar::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -6px;
      bottom: -6px;
    }
    .splitbar::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 2px;
      width: 28px;
      height: 3px;
      margin-left: -14px;
      border-radius: 99px;
      background: rgba(0,0,0,.22);
    }
    .splitbar:hover { background: rgba(0,0,0,.18); }

    .ai {
      position: relative;
      flex: 1;
      min-height: 168px;
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }
    .ai.drop-hot { box-shadow: inset 0 0 0 1px rgba(0,0,0,.28); }
    .ai-hint {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: rgba(247,247,245,.92);
      z-index: 4;
      pointer-events: none;
    }
    .desk.dragging .ai .ai-hint { display: flex; }

    .ai-tabs {
      display: flex;
      gap: 2px;
      padding: 6px 8px 0;
      flex-shrink: 0;
    }
    .ai-tabs button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--faint);
      font-size: 12px;
      cursor: pointer;
    }
    .ai-tabs button.on { background: var(--panel-2); color: var(--text); font-weight: 600; }
    .ai-tabs button:disabled { opacity: .35; cursor: not-allowed; }
    .ai-tabs .ico { width: 12px; height: 12px; }

    .ai-body {
      flex: 1;
      overflow: auto;
      padding: 8px 10px 6px;
    }
    .recipes {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .recipes button,
    .run,
    .result-actions button,
    .composer button,
    .clip-btn,
    .quiet {
      height: 28px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .recipes button:hover:not(:disabled),
    .quiet:hover:not(:disabled),
    .clip-btn:hover:not(:disabled),
    .result-actions button:hover:not(:disabled):not(.primary) { background: var(--panel-hover); }
    .recipes button:active:not(:disabled),
    .quiet:active:not(:disabled),
    .clip-btn:active:not(:disabled),
    .result-actions button:active:not(:disabled):not(.primary) { background: var(--panel-press); }
    .recipes button:disabled,
    .composer button:disabled { opacity: .38; cursor: not-allowed; }
    .facts {
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--panel-2);
      margin-bottom: 8px;
    }
    .facts div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 26px;
      padding: 0 8px;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    .facts div:last-child { border-bottom: 0; }
    .facts b { font-weight: 500; color: var(--text); }
    .run {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--text);
      color: var(--panel);
      border-color: transparent;
      font-weight: 600;
      height: 30px;
    }
    .run:hover { background: var(--blue-press); }
    .label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }

    .tty-caption { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .pty-well {
      min-height: 148px;
      border: 1px solid rgba(0,0,0,.2);
      border-radius: 8px;
      background: #171717;
      padding: 8px 10px;
      color: #e8e8e4;
    }
    .pty-well:has(.hint) {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pty-well .hint { color: #a8a8a8; margin: 0; }
    .tty-line { font-family: var(--mono); font-size: 12px; line-height: 1.55; }
    .tty-line.sys { color: #9a9a96; }
    .tty-line.in { color: #e8e8e4; }
    .tty-line.out { color: #e8e8e4; white-space: pre-wrap; }
    .tty-line.file { color: #b8b8b4; }

    .result-doc {
      font-size: 12px;
      line-height: 1.55;
      color: var(--muted);
      white-space: pre-wrap;
    }
    .result-doc h3 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .result-actions { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 6px; margin-top: 10px; }
    .result-actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .result-actions .primary {
      background: var(--text);
      color: var(--panel);
      border-color: transparent;
      font-weight: 600;
      cursor: grab;
    }
    .toast { font-size: 11px; color: var(--text); margin-bottom: 8px; }

    .composer {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 6px 8px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }
    .composer .count {
      min-width: 32px;
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .composer input {
      flex: 1;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 0 8px;
      font-size: 12px;
      outline: none;
    }
    .composer input:focus { border-color: var(--text); }
    .composer .go {
      width: 36px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--text);
      color: var(--panel);
      border-color: transparent;
      font-weight: 600;
    }
    .clip-btn {
      width: 36px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .quiet {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: auto;
      padding: 0 10px;
    }
    .recipes button {
      height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
    }
    .ico {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .foot-hint {
      padding: 0 10px 7px;
      font-size: 10px;
      color: var(--faint);
      flex-shrink: 0;
    }

    .pile {
      position: absolute;
      right: 432px;
      top: 88px;
      width: 216px;
      color: #a8a8a4;
      z-index: 5;
    }
    .pile h1 {
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: #e8e8e4;
    }
    .pile p {
      margin: 0 0 12px;
      font-size: 12px;
      line-height: 1.45;
      max-width: 32ch;
    }
    .chip, .clip-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 208px;
      margin-bottom: 8px;
      padding: 8px 10px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 8px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 6px 16px rgba(0,0,0,.18);
      font-size: 12px;
      color: #e8e8e4;
      cursor: grab;
    }
    .chip:active, .clip-chip:active { cursor: grabbing; }
    .chip .kind, .clip-chip .kind {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--faint);
      width: 36px;
    }

    .finder {
      position: absolute;
      left: 36px;
      top: 88px;
      width: 240px;
      min-height: 168px;
      padding: 12px;
      background: #2a2a2c;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 12px 32px rgba(0,0,0,.35);
      z-index: 6;
    }
    .finder.hot { background: #111; box-shadow: inset 0 0 0 1px #fff; }
    .finder h2 {
      margin: 0 0 4px;
      font-size: 13px;
      font-weight: 600;
    }
    .finder p { margin: 0 0 10px; font-size: 11px; color: #9a9a96; line-height: 1.4; }
    .finder .got {
      font-size: 12px;
      padding: 6px 0;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #e8e8e4;
    }
    .finder .got:first-of-type { border-top: 0; }

    .scenes {
      position: absolute;
      left: 20px;
      bottom: 22px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      z-index: 40;
      max-width: 560px;
    }
    .scenes span { font-size: 10px; color: #8a8a86; }
    .scenes button {
      height: 22px;
      padding: 0 8px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.28);
      color: #b8b8b4;
      font-size: 11px;
      cursor: pointer;
    }
    .scenes button.on { color: #f7f7f5; background: rgba(255,255,255,.12); }
    .note {
      position: absolute;
      right: 20px;
      bottom: 24px;
      font-size: 11px;
      color: #8a8a86;
    }
  </style>
</head>
<body>
  <!--
    THESIS: One 400px menu extra. Files on top, talk below. Refuses a side-by-side terminal, a clipboard-manager home, and a colored HUD.
    OWN-WORLD: Paper sheet over a dark desk. Near-white ground, ink type, black for send/select/drop. SF Symbols for actions; file kinds stay letter tags.
    STORY: Stage above, talk below, take the new file out by drag or clipboard.
    FIRST VIEWPORT: Panel hung from the status item. Airy header, list, hairline splitter, AI pane on the same paper.
    FORM: Nordic paper tray, seed 93ef9156, user-pinned black-and-white. Operate.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <div class="desk" id="desk">
    <header class="menubar">
      <div class="menubar-left">
        <svg class="apple" viewBox="0 0 14 16" fill="currentColor" aria-hidden="true">
          <path d="M11.4 8.3c0-2 1.6-3 1.7-3.1-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.6 0-1.6-.7-2.7-.7-1.4 0-2.7.8-3.4 2.1-1.5 2.6-.4 6.4 1 8.5.7 1 1.5 2.2 2.6 2.1 1 .0 1.4-.7 2.7-.7s1.6.7 2.7.6c1.1 0 1.8-1 2.5-2 .8-1.1 1.1-2.2 1.1-2.2s-2.1-.8-2.1-3.2zM9.4 2.7c.6-.7 1-1.7.9-2.7-1 .1-2.1.7-2.7 1.5-.6.7-1.1 1.7-.9 2.7 1.1.1 2.1-.5 2.7-1.5z"/>
        </svg>
        <span>Finder</span>
        <span>文件</span>
        <span>编辑</span>
        <span>显示</span>
      </div>
      <div class="menubar-right">
        <button class="status-item" id="status" type="button" aria-label="DropAgent">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 4.5h10v2.2L8 11 3 6.7V4.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M5.5 12.5h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          DropAgent
        </button>
        <span class="clock" id="clock">3:20</span>
      </div>
    </header>

    <div class="edge" id="edge" data-drop="stage">放到这里，加入架子</div>

    <section class="finder" id="finder" aria-label="桌面投放">
      <h2>桌面</h2>
      <p>从 DropAgent 把文件拖到这里，模拟拖到别的窗口。</p>
      <div id="finderList"></div>
    </section>

    <aside class="pile">
      <h1>拖进去</h1>
      <p>拖的时候：上半是加入，下半 AI 区是发给当前终端。文件行也可以拖出来。</p>
      <div class="chip" role="button" draggable="true" data-name="Q3-pricing.pdf" data-kind="pdf"><span class="kind">PDF</span>Q3-pricing.pdf</div>
      <div class="chip" role="button" draggable="true" data-name="截图 09-05.png" data-kind="image"><span class="kind">PNG</span>截图 09-05.png</div>
      <div class="chip" role="button" draggable="true" data-name="https://dropoverapp.com" data-kind="url"><span class="kind">URL</span>dropoverapp.com</div>
      <div class="clip-chip" id="clipChip" role="button" draggable="true" data-name="剪贴板" data-kind="clip"><span class="kind">CLIP</span><span id="clipLabel">剪贴板是空的</span></div>
    </aside>

    <div class="panel" id="panel" role="dialog" aria-label="DropAgent 面板">
      <div class="head">
        <div class="brand">DropAgent</div>
        <div class="agent-wrap">
          <button type="button" class="agent-pill" id="agentPill" aria-haspopup="listbox" aria-expanded="false">
            <span class="status-ico" id="agentIcon" aria-hidden="true"></span>
            <span id="agentLabel">Grok</span>
            <svg class="chev" width="8" height="8" viewBox="0 0 8 8" aria-hidden="true">
              <path d="M1.5 2.8 4 5.2 6.5 2.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="engine-menu" id="engineMenu" hidden>
            <button type="button" data-pick="Grok">Grok</button>
            <button type="button" data-pick="Claude">Claude</button>
            <button type="button" data-pick="Gemini" disabled>Gemini（未安装）</button>
            <button type="button" data-pick="Codex">Codex</button>
            <button type="button" data-pick="">未发现终端</button>
          </div>
        </div>
      </div>

      <div class="list-wrap" id="listWrap">
        <div class="list" id="list" data-drop="stage"></div>
        <div class="list-hint"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 9.5V13h10V9.5"/><path d="M8 2.5v8"/><path d="M5 8.5 8 11.5 11 8.5"/></svg>加入架子</div>
      </div>
      <div class="splitbar" id="splitbar" title="拖动改变列表高度"></div>

      <div class="ai" id="ai" data-drop="tui">
        <div class="ai-hint"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h10M9 4.5 13.5 8 9 11.5"/></svg><span id="aiHintText">发给 Grok</span></div>
        <div class="ai-tabs">
          <button type="button" data-ai="work" id="tabWork"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx=".8"/><rect x="9" y="2.5" width="4.5" height="4.5" rx=".8"/><rect x="2.5" y="9" width="4.5" height="4.5" rx=".8"/><rect x="9" y="9" width="4.5" height="4.5" rx=".8"/></svg>动作</button>
          <button type="button" data-ai="tty" id="tabTty"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5 10.5h6M5 6.5l2 2-2 2"/></svg>终端</button>
          <button type="button" data-ai="result" id="tabResult"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h6l3 3V13.5H4z"/><path d="M10 2.5V6h3.5"/><path d="M6 9h4M6 11.5h3"/></svg>结果</button>
        </div>
        <div class="ai-body" id="aiView"></div>
        <div class="composer">
          <span class="count" id="composeMeta"></span>
          <input id="prompt" type="text" placeholder="写给 Grok，回车发送" autocomplete="off" />
          <button class="clip-btn" id="pasteBtn" type="button" title="从剪贴板加入" aria-label="从剪贴板加入">
            <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="2" width="8" height="12" rx="1.5"/><path d="M3 5h2m6 0h2v9H5"/></svg>
          </button>
          <button class="go" id="send" type="button" aria-label="发送">
            <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h10M9 4.5 13.5 8 9 11.5"/></svg>
          </button>
        </div>
        <div class="foot-hint" id="footHint">发送进 Grok 终端，不是副本沙箱。文件可拖出或复制。</div>
      </div>
    </div>

    <nav class="scenes" aria-label="评审场景">
      <span>评审</span>
      <button type="button" data-scene="empty">空</button>
      <button type="button" data-scene="staged">暂存</button>
      <button type="button" data-scene="multi">多选</button>
      <button type="button" data-scene="sent">终端</button>
      <button type="button" data-scene="web">网站</button>
      <button type="button" data-scene="done">结果</button>
      <button type="button" data-scene="noagent">无终端</button>
      <button type="button" data-scene="onlytui">仅终端</button>
    </nav>
    <div class="note">合成数据 · 终端是假的</div>
  </div>

  <script>
    const recipes = [
      ["总结", "总结文件"],
      ["抽取", "提取结构化信息"],
      ["翻译", "翻译并保留格式"],
      ["脱敏", "敏感信息脱敏"],
      ["转 MD", "转换为 Markdown"],
      ["新交付", "根据多份材料生成一个新交付"]
    ];
    const kinds = {
      pdf: { tag: "PDF", word: "文档" },
      image: { tag: "PNG", word: "图片" },
      url: { tag: "URL", word: "链接" },
      md: { tag: "MD", word: "文稿" },
      web: { tag: "WEB", word: "网站" },
      clip: { tag: "CLIP", word: "剪贴板" }
    };
    const previews = {
      "总结文件": "北美上调 8%，渠道折扣从 Q2 的 14% 收到 9%。附件里的三档套餐都还在，没有砍 SKU。\n\n不能对外讲具体折扣数字。",
      "提取结构化信息": "region: NA\ndelta: +8%\ndiscount: 9%\nsku_cut: false",
      "翻译并保留格式": "North America +8%.\nChannel discount tightened from 14% to 9%.",
      "敏感信息脱敏": "客户名、金额、内部代号已替换为 [REDACTED]。",
      "转换为 Markdown": "# Q3 Pricing\n\n- NA +8%\n- Channel discount 9%",
      "根据多份材料生成一个新交付": "给销售的一页 briefing：调价、口径、不能对外说的三件事。"
    };
    const outputs = {
      "总结文件": "summary.md",
      "提取结构化信息": "extracted.json",
      "翻译并保留格式": "Q3-pricing.zh.md",
      "敏感信息脱敏": "Q3-pricing.redacted.pdf",
      "转换为 Markdown": "converted.md",
      "根据多份材料生成一个新交付": "brief.md"
    };

    const state = {
      open: true, hasTui: true, hasCodex: true, tui: "Grok",
      selected: [], anchor: null, items: [],
      copied: null, ttyLog: [], ai: "work", listH: 140, listTouched: false,
      clip: "渠道折扣收到 9%，不要对外讲数字。",
      desk: []
    };

    const $ = (id) => document.getElementById(id);
    const desk = $("desk");
    const promptEl = $("prompt");

    function nowLabel() {
      const d = new Date();
      return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
    }
    function itemById(id) { return state.items.find((x) => x.id === id); }
    function selectedItems() { return state.selected.map(itemById).filter(Boolean); }
    function displayListH() {
      if (state.listTouched) return state.listH;
      if (!state.items.length) return 140;
      return Math.min(320, Math.max(56, state.items.length * 56));
    }
    function canSend() {
      if (!state.hasTui) return false;
      return !selectedItems().some((x) => x.status === "confirm" || x.status === "running");
    }
    function composerPlaceholder() {
      if (!state.hasTui) return "未发现终端 Agent";
      if (selectedItems().some((x) => x.status === "running")) return "等任务结束，或点取消";
      if (selectedItems().some((x) => x.status === "confirm")) return "先运行或取消这次动作";
      return `写给 ${state.tui}，回车发送`;
    }
    function giveTerminalRoom() {
      const target = state.items.length ? Math.min(108, Math.max(56, state.items.length * 56)) : 108;
      if (displayListH() > target) {
        state.listH = target;
        state.listTouched = true;
      }
    }
    function kindOf(k) { return kinds[k] || { tag: "FILE", word: "文件" }; }

    function createItem(name, kind) {
      const id = String(Date.now()) + Math.random().toString(16).slice(2, 6);
      const item = {
        id, name, kind, source: name, time: nowLabel(),
        status: "idle", recipe: null, event: "", output: null
      };
      state.items.unshift(item);
      return item;
    }
    function addItem(name, kind) {
      const item = createItem(name, kind);
      state.selected = [item.id];
      state.anchor = item.id;
      state.open = true;
      state.ai = "work";
      render();
      return item;
    }

    function facts(count) {
      if (!state.hasCodex) return [["读", "不能运行"], ["写", "—"], ["网络", "—"], ["隔离", "需要 Codex"]];
      return [
        ["读", count > 1 ? `${count} 份材料的副本` : "这份材料的副本"],
        ["写", "仅任务目录"],
        ["网络", "关"],
        ["隔离", "Workspace"]
      ];
    }
    const recipeIcons = {
      "总结": '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6"/></svg>',
      "抽取": '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 3 8l3 5M10 3l3 5-3 5"/></svg>',
      "翻译": '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M3 8h10M8 2.5c-2 2-2 9 0 11M8 2.5c2 2 2 9 0 11"/></svg>',
      "脱敏": '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8s2.5-4 6-4 6 4 6 4-2.5 4-6 4-6-4-6-4Z"/><path d="M3 13 13 3"/></svg>',
      "转 MD": '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5h10v9H3zM5 7v4M8 6v5M11 8v3"/></svg>',
      "新交付": '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5h7v8H3zM6 3h7v8"/></svg>'
    };
    const ico = {
      play: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l8-4.5z"/></svg>',
      copy: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="6" y="3" width="7" height="9" rx="1.2"/><path d="M4 6H3.2A1.2 1.2 0 0 0 2 7.2v6.6A1.2 1.2 0 0 0 3.2 15H9"/></svg>',
      tty: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5 10.5h6M5 6.5l2 2-2 2"/></svg>',
      out: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.5V3M5.5 5.5 8 3l2.5 2.5"/><path d="M3 12.5h10"/></svg>',
      x: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4 4 12"/></svg>',
      tray: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 9.5V13h10V9.5"/><path d="M8 2.5v8"/><path d="M5 8.5 8 11.5 11 8.5"/></svg>',
      check: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="m5.5 8.2 1.8 1.8 3.4-3.6"/></svg>',
      slash: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M4 12 12 4"/></svg>'
    };
    function recipeButtons() {
      const id = state.anchor || state.selected[0] || "";
      return recipes.map(([short, full]) =>
        `<button type="button" data-act="recipe" data-id="${id}" data-recipe="${full}" ${state.hasCodex ? "" : "disabled"}>${recipeIcons[short] || ""}${short}</button>`
      ).join("");
    }

    function currentResult() {
      const it = selectedItems().find((x) => x.status === "done")
        || selectedItems().find((x) => x.status === "sent")
        || selectedItems()[0]
        || null;
      return it || null;
    }

    function renderAi() {
      const n = state.selected.length;
      const view = $("aiView");
      $("tabWork").classList.toggle("on", state.ai === "work");
      $("tabTty").classList.toggle("on", state.ai === "tty");
      $("tabResult").classList.toggle("on", state.ai === "result");
      const hasResult = !!currentResult();
      $("tabResult").disabled = !hasResult;
      $("tabTty").disabled = !state.ttyLog.length && state.ai !== "tty";

      if (state.ai === "tty") {
        const file = [...state.ttyLog].reverse().find((l) => l.k === "file");
        const caption = file
          ? `${state.tui} · ${file.t.replace(/^📎\s+/, "").replace(/^材料\s+/, "")}`
          : (state.ttyLog.find((l) => l.k === "sys")?.t || `${state.tui}  ·  本机会话`);
        const lines = state.ttyLog.filter((l) => l.k === "in" || l.k === "out");
        view.innerHTML = `<div class="tty-caption">${caption}</div>
          <div class="pty-well">${lines.length
            ? lines.map((l) => `<div class="tty-line ${l.k}">${l.t}</div>`).join("")
            : `<div class="hint">发送后，${state.tui} 会出现在这里</div>`}</div>`;
        return;
      }
      if (state.ai === "result") {
        const it = currentResult();
        if (!it) { view.innerHTML = `<div class="hint">点一条已完成的文件，或点架子上的材料查看。</div>`; return; }
        let body = "";
        if (it.kind === "web") {
          body = `<div class="hint">${it.url || "https://example.com"}</div><div class="hint">正文和截图在这一页。</div>`;
          if (it.status === "sent") body += `<div class="hint">材料已送进终端。在「终端」里继续说。</div>`;
        } else if (it.kind === "image") {
          body = `<div class="hint">这张图可以拖出或发给终端。</div>`;
        } else if (it.kind === "clip" || it.kind === "md") {
          body = `<div class="hint">正文在这一页，可复制或拖出。</div>`;
        } else if (it.kind === "url") {
          body = `<div class="hint">${it.url || it.name}</div><div class="hint">这是链接，不会自动抓正文。要网页材料请用 ⌃⌥W。</div>`;
        } else if (it.status === "done") {
          body = previews[it.recipe] || "";
        } else {
          body = state.ttyLog.filter((x) => x.k === "out").map((x) => x.t).join("\n") || "已送到终端，在「终端」里看过程。";
        }
        view.innerHTML = `<div class="result-doc"><h3>${it.output || it.name}</h3>${body}</div>
          ${state.copied === it.id ? `<div class="toast">已复制到剪贴板</div>` : ""}
          <div class="result-actions">
            <button class="primary" draggable="true" data-act="dragout" data-id="${it.id}">${ico.out}拖出</button>
            <button type="button" data-act="copy" data-id="${it.id}">${ico.copy}复制</button>
            <button type="button" data-act="preview" data-id="${it.id}">${ico.tty}终端</button>
          </div>`;
        return;
      }

      const batch = selectedItems();
      const idle = batch.filter((x) => x.status === "idle" || x.status === "confirm");
      const confirming = idle.some((x) => x.status === "confirm");
      if (!batch.length) {
        const empty = state.hasTui
          ? (state.items.length
            ? `点列表里的文件，或拖到上方加入、拖到这一区发给 ${state.tui}。`
            : `拖到上方加入架子，或拖到这一区发给 ${state.tui}。`)
          : "未发现终端。仍可把文件放到上面。";
        view.innerHTML = `<div class="hint">${empty}</div>`;
        return;
      }
      if (confirming) {
        view.innerHTML = `<div class="label">对 ${idle.length} 项 · ${idle[0].recipe}</div>
          <div class="facts">${facts(idle.length).map(([k, v]) => `<div>${k}<b>${v}</b></div>`).join("")}</div>
          <button class="run" data-act="run" data-id="${idle[0].id}" ${state.hasCodex ? "" : "disabled"}>${ico.play}在副本中运行</button>
          <button class="quiet" data-act="cancel" data-id="${idle[0].id}" style="margin-top:6px">${ico.x}取消</button>`;
        return;
      }
      const running = batch.find((x) => x.status === "running");
      if (running) {
        view.innerHTML = `<div class="label">运行中</div><div class="hint">${running.event}</div>
          <div class="hint">${state.hasCodex ? `Codex 在副本里跑，不是 ${state.tui} 终端。` : "副本任务需要 Codex。"}</div>
          <button class="quiet" data-act="cancel" data-id="${running.id}" style="margin-top:8px">${ico.x}取消</button>`;
        return;
      }
      let extra = "安装终端后可发送。现在只能暂存。";
      if (state.hasTui && state.hasCodex) extra = `或在下面写一句话，发送到 ${state.tui} 终端。`;
      else if (state.hasTui) extra = `动作需要 Codex。下面可以发给 ${state.tui}。`;
      const webPeek = batch.length === 1 && batch[0].kind === "web"
        ? `<div class="hint">${batch[0].url || ""}</div><div class="hint">点「结果」看正文和截图。</div>`
        : "";
      const imagePeek = batch.length === 1 && batch[0].kind === "image"
        ? `<div class="hint">点「结果」看这张图。</div>`
        : "";
      const clipPeek = batch.length === 1 && batch[0].kind === "clip"
        ? `<div class="hint">点「结果」看这段字。</div>`
        : "";
      const urlPeek = batch.length === 1 && batch[0].kind === "url"
        ? `<div class="hint">点「结果」看链接。</div>`
        : "";
      view.innerHTML = `${webPeek}${imagePeek}${clipPeek}${urlPeek}<div class="label">${n > 1 ? "对 " + n + " 项" : "动作"}</div>
        <div class="recipes">${recipeButtons()}</div>
        <div class="hint">${extra}</div>`;
    }

    function render() {
      $("status").classList.toggle("open", state.open);
      $("panel").classList.toggle("show", state.open);
      $("agentIcon").innerHTML = state.hasTui ? ico.check : ico.slash;
      $("agentLabel").textContent = state.hasTui ? state.tui : "未发现终端";
      $("aiHintText").textContent = state.hasTui ? `发给 ${state.tui}` : "先加入架子";
      const sendOK = canSend();
      promptEl.disabled = !sendOK;
      $("send").disabled = !sendOK;
      promptEl.placeholder = composerPlaceholder();
      $("listWrap").style.height = displayListH() + "px";
      $("composeMeta").textContent = state.selected.length ? `${state.selected.length} 项` : "";
      const busy = selectedItems().some((x) => x.status === "confirm" || x.status === "running");
      $("footHint").textContent = busy
        ? "⌃⌥D 打开，⌃⌥W 抓当前页。"
        : state.hasTui
          ? `发送进 ${state.tui} 终端，不是副本沙箱。文件可拖出或复制。⌘V 从剪贴板加入。`
          : "没有终端，只能先放架子。动作还需要 Codex。";
      document.querySelectorAll("#engineMenu [data-pick]").forEach((b) => {
        const pick = b.dataset.pick;
        b.classList.toggle("on", state.hasTui ? pick === state.tui : pick === "");
      });
      $("clipLabel").textContent = state.clip ? state.clip.slice(0, 18) + (state.clip.length > 18 ? "…" : "") : "剪贴板是空的";

      if (!state.items.length) {
        $("list").innerHTML = `<div class="empty">${ico.tray}<div>拖到这里、菜单栏图标或屏幕顶边</div><small>先放下，或拖到下方发给 ${state.hasTui ? state.tui : "终端"}</small></div>`;
      } else {
        $("list").innerHTML = state.items.map((it) => {
          const k = kindOf(it.kind);
          const sel = state.selected.includes(it.id);
          let meta = `${k.word} · 待处理`;
          if (it.status === "confirm") meta = `${k.word} · ${it.recipe} · 未运行`;
          if (it.status === "running") meta = `<span class="pill run">运行中</span>${k.word}`;
          if (it.status === "done") meta = `<span class="pill ok">可拖出</span>${k.word} · 来自 ${it.source}`;
          if (it.status === "sent") meta = `<span class="pill sent">已进终端</span>${k.word}`;
          const drag = it.status !== "running";
          return `<div class="row ${sel ? "sel" : ""} ${it.status}" data-act="select" data-id="${it.id}" ${drag ? `draggable="true"` : ""}>
            <span class="tag">${k.tag}</span>
            <div class="name">${it.name}</div>
            <div class="time">${it.time}</div>
            ${it.status !== "running" ? `<button class="kill" data-act="remove" data-id="${it.id}" aria-label="移除">${ico.x}</button>` : `<span></span>`}
            <div class="meta">${meta}</div>
          </div>`;
        }).join("");
      }

      renderAi();
      $("finderList").innerHTML = state.desk.length
        ? state.desk.map((n) => `<div class="got">${n}</div>`).join("")
        : `<div class="got" style="color:var(--faint)">还没有拖出来的文件</div>`;
    }

    function applyRecipe(full) {
      selectedItems().filter((x) => x.status === "idle" || x.status === "confirm").forEach((x) => {
        x.recipe = full; x.status = "confirm";
      });
      state.ai = "work";
      render();
    }
    function startRun(it) {
      if (!state.hasCodex) return;
      it.status = "running";
      it.event = "复制到 input/ 与 work/";
      render();
      it._t1 = setTimeout(() => { it.event = "Codex 读取 work/ 中的材料"; render(); }, 700);
      it._t2 = setTimeout(() => { it.event = "写入 output/" + (outputs[it.recipe] || "summary.md"); render(); }, 1400);
      it._t3 = setTimeout(() => {
        it.status = "done";
        it.output = outputs[it.recipe] || "summary.md";
        it.name = it.output;
        it.kind = "md";
        it.event = "";
        state.ai = "result";
        render();
      }, 2200);
    }
    function sendToTui(items, text) {
      if (!canSend()) return;
      if (!items.length && !text) return;
      state.open = true;
      if (!state.ttyLog.length) state.ttyLog.push({ k: "sys", t: state.tui + "  ·  本机会话" });
      items.forEach((it) => {
        if (it.status === "idle" || it.status === "confirm" || it.status === "sent") {
          it.status = "sent";
          it.recipe = null;
          state.ttyLog.push({ k: "file", t: "📎  " + it.name });
        }
      });
      if (text) {
        state.ttyLog.push({ k: "in", t: "›  " + text });
        state.ttyLog.push({ k: "out", t: previews["总结文件"] });
      } else {
        state.ttyLog.push({ k: "in", t: "›  （没有附带说明）" });
        state.ttyLog.push({ k: "out", t: "已收到 " + items.length + " 个文件。要做什么，直接打在上面。" });
      }
      promptEl.value = "";
      state.ai = "tty";
      giveTerminalRoom();
      render();
    }

    function copyItem(it) {
      const text = it.output || it.name;
      const body = it.status === "done" ? (previews[it.recipe] || text) : text;
      state.clip = body;
      state.copied = it.id;
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(body);
      render();
      setTimeout(() => { if (state.copied === it.id) { state.copied = null; render(); } }, 1200);
    }

    function pasteClip() {
      const name = state.clip ? `剪贴板 ${nowLabel()}` : "剪贴板";
      addItem(name, "clip");
    }

    $("status").addEventListener("click", () => { state.open = !state.open; render(); });
    $("send").addEventListener("click", () => {
      if (!canSend()) return;
      sendToTui(selectedItems(), promptEl.value.trim());
    });
    $("pasteBtn").addEventListener("click", pasteClip);
    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        if (!canSend()) return;
        sendToTui(selectedItems(), promptEl.value.trim());
      }
    });

    const engineMenu = $("engineMenu");
    const agentPill = $("agentPill");
    agentPill.addEventListener("click", (e) => {
      e.stopPropagation();
      const open = engineMenu.hidden;
      engineMenu.hidden = !open;
      agentPill.setAttribute("aria-expanded", String(open));
    });
    engineMenu.addEventListener("click", (e) => {
      e.stopPropagation();
      const b = e.target.closest("[data-pick]");
      if (!b || b.disabled) return;
      const pick = b.dataset.pick;
      state.hasTui = pick !== "";
      if (pick) {
        state.tui = pick;
        state.ttyLog = [];
      }
      engineMenu.hidden = true;
      agentPill.setAttribute("aria-expanded", "false");
      render();
    });
    document.addEventListener("click", () => {
      if (engineMenu.hidden) return;
      engineMenu.hidden = true;
      agentPill.setAttribute("aria-expanded", "false");
    });

    document.querySelectorAll("[data-ai]").forEach((b) => {
      b.addEventListener("click", () => {
        if (b.disabled) return;
        state.ai = b.dataset.ai;
        if (state.ai === "tty") giveTerminalRoom();
        render();
      });
    });

    function onAction(e) {
      const btn = e.target.closest("[data-act]");
      if (!btn) return;
      const id = btn.dataset.id;
      const it = itemById(id);
      const act = btn.dataset.act;
      if (act === "remove") {
        e.stopPropagation();
        state.items = state.items.filter((x) => x.id !== id);
        state.selected = state.selected.filter((x) => x !== id);
        render();
        return;
      }
      if (act === "select") {
        if (e.target.closest("button")) return;
        if (!it) return;
        if (e.metaKey || e.ctrlKey) {
          state.selected = state.selected.includes(id) ? state.selected.filter((x) => x !== id) : [...state.selected, id];
          state.anchor = id;
        } else {
          state.selected = [id];
          state.anchor = id;
        }
        if (it.status === "done" || it.status === "sent") state.ai = "result";
        else if (it.status === "running") state.ai = "work";
        else state.ai = "work";
        render();
      }
      if (act === "recipe") applyRecipe(btn.dataset.recipe);
      if (act === "run" && state.hasCodex) {
        selectedItems().filter((x) => x.status === "confirm").forEach((x, i) => setTimeout(() => startRun(x), i * 350));
      }
      if (act === "cancel" && it) {
        clearTimeout(it._t1); clearTimeout(it._t2); clearTimeout(it._t3);
        it.status = "idle"; it.recipe = null; it.event = "";
        render();
      }
      if (act === "copy" && it) copyItem(it);
      if (act === "preview") { state.ai = "tty"; render(); }
    }
    $("list").addEventListener("click", onAction);
    $("aiView").addEventListener("click", onAction);

    $("list").addEventListener("dragstart", (e) => {
      const row = e.target.closest(".row[draggable]");
      if (!row) return;
      const it = itemById(row.dataset.id);
      if (!it) return;
      e.dataTransfer.setData("shelf-id", it.id);
      e.dataTransfer.setData("name", it.name);
      e.dataTransfer.setData("kind", it.kind);
      e.dataTransfer.setData("text/plain", it.output || it.name);
      if (it.status === "done" || it.status === "sent") e.dataTransfer.setData("out", it.output || it.name);
      e.dataTransfer.effectAllowed = "copy";
      row.classList.add("dragging-out");
    });
    $("list").addEventListener("dragend", () => {
      document.querySelectorAll(".dragging-out").forEach((x) => x.classList.remove("dragging-out"));
    });
    $("aiView").addEventListener("dragstart", (e) => {
      const handle = e.target.closest("[data-act=dragout]");
      if (!handle) return;
      const it = itemById(handle.dataset.id);
      e.dataTransfer.setData("text/plain", it.output || it.name);
      e.dataTransfer.setData("out", it.output || it.name);
    });

    function readDrop(e) {
      return {
        name: e.dataTransfer.getData("name") || e.dataTransfer.getData("text/plain") || "未命名",
        kind: e.dataTransfer.getData("kind") || (e.dataTransfer.getData("out") ? "md" : "pdf"),
        out: e.dataTransfer.getData("out")
      };
    }
    function bindDrop(el, fn) {
      el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("hot"); el.classList.add("drop-hot"); });
      el.addEventListener("dragleave", () => { el.classList.remove("hot"); el.classList.remove("drop-hot"); });
      el.addEventListener("drop", (e) => {
        e.preventDefault();
        e.stopPropagation();
        el.classList.remove("hot");
        el.classList.remove("drop-hot");
        fn(e);
      });
    }
    bindDrop($("list"), (e) => {
      if (e.dataTransfer.getData("shelf-id")) return;
      const d = readDrop(e);
      addItem(d.name, d.kind);
    });
    bindDrop($("ai"), (e) => {
      const sid = e.dataTransfer.getData("shelf-id");
      if (sid) {
        const it = itemById(sid);
        if (it) sendToTui([it], promptEl.value.trim());
        return;
      }
      const d = readDrop(e);
      if (d.out) return;
      const item = createItem(d.name, d.kind);
      state.selected = [item.id];
      state.anchor = item.id;
      sendToTui([item], promptEl.value.trim());
    });
    bindDrop($("edge"), (e) => { const d = readDrop(e); addItem(d.name, d.kind); });
    bindDrop($("status"), (e) => { $("status").dataset.drop = "stage"; const d = readDrop(e); addItem(d.name, d.kind); });
    bindDrop($("finder"), (e) => {
      const d = readDrop(e);
      state.desk.unshift(d.out || d.name);
      render();
    });

    document.querySelectorAll(".chip, #clipChip").forEach((chip) => {
      chip.addEventListener("dragstart", (e) => {
        const name = chip.dataset.kind === "clip" ? (state.clip || "剪贴板") : chip.dataset.name;
        e.dataTransfer.setData("name", name);
        e.dataTransfer.setData("kind", chip.dataset.kind);
        e.dataTransfer.setData("text/plain", name);
        desk.classList.add("dragging");
        $("status").classList.add("hot");
      });
      chip.addEventListener("dragend", () => {
        desk.classList.remove("dragging");
        $("status").classList.remove("hot");
        document.querySelectorAll(".hot, .drop-hot").forEach((z) => { z.classList.remove("hot"); z.classList.remove("drop-hot"); });
      });
    });
    desk.addEventListener("dragover", (e) => {
      if ([...e.dataTransfer.types].length) desk.classList.add("dragging");
    });

    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "v" && document.activeElement !== promptEl) {
        e.preventDefault();
        pasteClip();
      }
      if (e.key === "Escape" && document.activeElement !== promptEl) { state.open = false; render(); }
    });

    const bar = $("splitbar");
    bar.addEventListener("mousedown", (e) => {
      e.preventDefault();
      const startY = e.clientY;
      const startH = displayListH();
      const move = (ev) => {
        state.listTouched = true;
        state.listH = Math.max(56, Math.min(320, startH + (ev.clientY - startY)));
        $("listWrap").style.height = displayListH() + "px";
      };
      const up = () => {
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up);
      };
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });

    document.querySelectorAll(".scenes button").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".scenes button").forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
        const scene = b.dataset.scene;
        state.open = true; state.copied = null; state.ttyLog = []; state.desk = [];
        promptEl.value = "";
        state.listTouched = false;
        state.listH = 140;
        const idle = (id, name, kind, time) => ({ id, name, kind, source: name, time, status: "idle", recipe: null, event: "", output: null });
        function connect(tui, hasCodex) {
          state.hasTui = !!tui; state.tui = tui || "Grok"; state.hasCodex = hasCodex;
        }
        if (scene === "empty") {
          connect("Grok", true); state.items = []; state.selected = []; state.anchor = null; state.ai = "work";
        }
        if (scene === "staged") {
          connect("Grok", true);
          state.items = [idle("1", "Q3-pricing.pdf", "pdf", "2:11"), idle("2", "截图 09-05.png", "image", "2:08")];
          state.selected = ["1"]; state.anchor = "1"; state.ai = "work";
        }
        if (scene === "multi") {
          connect("Grok", true);
          state.items = [idle("1", "Q3-pricing.pdf", "pdf", "2:11"), idle("2", "截图 09-05.png", "image", "2:08"), idle("3", "https://dropoverapp.com", "url", "2:07")];
          state.selected = ["1", "2"]; state.anchor = "1"; state.ai = "work";
        }
        if (scene === "sent") {
          connect("Grok", true); state.ai = "tty";
          state.items = [
            { id: "1", name: "Q3-pricing.pdf", source: "Q3-pricing.pdf", kind: "pdf", time: "2:11", status: "sent", recipe: null, event: "", output: null },
            { id: "2", name: "截图 09-05.png", source: "截图 09-05.png", kind: "image", time: "2:08", status: "sent", recipe: null, event: "", output: null }
          ];
          state.selected = ["1", "2"]; state.anchor = "1";
          state.ttyLog = [
            { k: "sys", t: "Grok  ·  本机会话" },
            { k: "file", t: "📎  Q3-pricing.pdf" },
            { k: "file", t: "📎  截图 09-05.png" },
            { k: "in", t: "›  哪几条不能对外说" },
            { k: "out", t: "渠道折扣收紧不要对外讲具体数字。三档套餐可以讲。" }
          ];
          giveTerminalRoom();
        }
        if (scene === "web") {
          connect("Grok", true);
          state.items = [{ id: "w", name: "Example Domain", kind: "web", source: "example.com", time: "2:16", status: "idle", recipe: null, event: "", output: null, url: "https://example.com" }];
          state.selected = ["w"]; state.anchor = "w"; state.ai = "work";
        }
        if (scene === "done") {
          connect("Grok", true); state.ai = "result";
          state.items = [
            { id: "1", name: "summary.md", source: "Q3-pricing.pdf", kind: "md", time: "2:14", status: "done", recipe: "总结文件", event: "", output: "summary.md" },
            { id: "2", name: "截图 09-05.png", source: "截图 09-05.png", kind: "image", time: "2:08", status: "idle", recipe: null, event: "", output: null }
          ];
          state.selected = ["1"]; state.anchor = "1";
        }
        if (scene === "noagent") {
          connect("", false); state.ai = "work";
          state.items = [idle("1", "Q3-pricing.pdf", "pdf", "2:11")];
          state.selected = ["1"]; state.anchor = "1";
        }
        if (scene === "onlytui") {
          connect("Grok", false); state.ai = "work";
          state.items = [idle("1", "Q3-pricing.pdf", "pdf", "2:11")];
          state.selected = ["1"]; state.anchor = "1";
        }
        render();
      });
    });

    function tickClock() {
      const d = new Date();
      $("clock").textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
    }
    tickClock();
    setInterval(tickClock, 15000);
    document.querySelector('[data-scene="staged"]').click();
  </script>
</body>
</html>
