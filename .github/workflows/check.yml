name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift
        run: swift --version
      - name: DropAgentCheck
        working-directory: macos
        run: swift run DropAgentCheck
